const TOPICS=[{"title": "Мировоззрение и его структура", "scene": "Вход в Архив закрыт. Собери компас, который помогает человеку выбирать жизненный путь.", "notes": ["Мировоззрение — система общих представлений о мире, о себе и своём месте в мире. Оно отвечает и на вопрос «как устроен мир?», и на вопрос «как мне жить?».", "Структура: знания, ценности, убеждения, идеалы, эмоции и чувства. Вместе они направляют поведение.", "Знание сообщает, как обстоят дела; ценность — что важно; убеждение — в чём я уверен; идеал — к чему стремлюсь. Мировоззрение формируется под влиянием семьи, культуры, образования и опыта."], "memory": "Знаю → ценю → убеждён → стремлюсь → чувствую → действую.", "oral": ["Дай определение мировоззрения.", "Назови знания, ценности, убеждения, идеалы и чувства.", "Покажи на примере, как они влияют на поступок.", "Объясни роль воспитания, культуры и личного опыта."], "questions": [{"id": "0-0", "text": "Ты считаешь свободу важнейшей частью жизни. Какой это элемент?", "options": ["Ценность", "Метод исследования", "Чувственное восприятие"], "explain": "Ценность — то, что человек считает важным и значимым."}, {"id": "0-1", "text": "«Я уверен, что нужно помогать слабым». Это прежде всего…", "options": ["Убеждение", "Идеал устройства Вселенной", "Научный эксперимент"], "explain": "Убеждение — взгляд, в правильности которого человек уверен."}, {"id": "0-2", "text": "«Хочу стать справедливым и ответственным человеком». Что задаёт ориентир?", "options": ["Идеал", "Физический закон", "Наблюдение"], "explain": "Идеал — представление о должном, образ желаемого человека или общества."}, {"id": "0-3", "text": "Хранитель утверждает: «Мировоззрение — только знания». Что он упустил?", "options": ["Ценности, убеждения, идеалы и чувства", "Только даты исторических событий", "Только законы природы"], "explain": "Мировоззрение включает не только знания, но и ценностное, эмоциональное и практическое отношение к миру."}], "source": "Мировоззрение — это общее представление человека о мире, о самом себе и о своём месте в этом мире.\n\nПроще говоря, мировоззрение отвечает на вопросы: «Как устроен мир? Кто я? Как мне жить? Что хорошо и что плохо? Во что я верю? Ради чего я живу?»\n\nМировоззрение есть у каждого человека, хотя оно может быть разным. Оно формируется под влиянием семьи, воспитания, образования, культуры, религии, личного опыта и общества. Например, один человек может считать, что главное в жизни — семья, другой — карьеру, третий — духовное развитие. Это связано с различиями в их мировоззрении.\n\nМировоззрение имеет определённую структуру, то есть состоит из нескольких элементов. Первый элемент — знания. Это наши представления о мире и о том, как он устроен. Например, мы знаем, что люди рождаются и умирают, что существуют природные явления, общество и другие люди.\n\nВторой элемент — ценности. Это то, что человек считает важным и значимым. К ценностям относятся добро, справедливость, свобода, любовь, семья, дружба, знания и другие вещи. Ценности помогают человеку понимать, что для него важно.\n\nТретий элемент — убеждения. Это взгляды, в правильности которых человек уверен. Например, человек может быть убеждён, что всегда нужно говорить правду или что человек должен помогать другим.\n\nЕщё один важный элемент — идеалы. Идеал — это представление о том, каким человек или общество должны быть. Например, человек может стремиться стать справедливым, образованным и ответственным.\n\nТакже в мировоззрение входят эмоции и чувства, потому что человек не только знает и думает, но и эмоционально относится к миру. И всё это вместе влияет на его поведение и поступки.\n\nТаким образом, мировоззрение — это не просто набор знаний. Это целая система представлений, ценностей, убеждений и идеалов, которая помогает человеку ориентироваться в мире и определять своё отношение к жизни.\n\nМировоззрение = представление о мире + представление о себе + ценности + убеждения + идеалы → поведение."}, {"title": "Мифология и религия", "scene": "На двух древних свитках — миф и молитва. Объясни, чем они похожи и чем отличаются.", "notes": ["Мифология — система мифов о происхождении и устройстве мира. Природное и сверхъестественное в мифе часто не разделены.", "Миф для носителя традиции — не просто выдумка: он объясняет мир, передаёт нормы, ценности и обычаи.", "Религия строится на вере в сверхъестественное, связи с высшими силами, обрядах и нормах поведения. Мифология и религия могут переплетаться; различие здесь учебное, а не жёсткая историческая граница."], "memory": "Миф — образный рассказ. Религия — вера и культ. Философия — обоснованное рассуждение.", "oral": ["Определи мифологию и религию.", "Объясни неразделённость природного и сверхъестественного в мифе.", "Назови веру, обряды и нормы в религии.", "Укажи общие функции и отличие от философского рассуждения."], "questions": [{"id": "1-0", "text": "Гром объясняют действием божества, а рассказ передаёт обычаи народа. Это пример…", "options": ["Мифологического мировоззрения", "Экспериментальной науки", "Формальной логики"], "explain": "Миф объясняет природу через образы и действия сверхъестественных существ."}, {"id": "1-1", "text": "Какое сочетание лучше описывает религию?", "options": ["Вера в сверхъестественное, обряды, нормы", "Только расчёт и эксперимент", "Только сомнение во всех утверждениях"], "explain": "Религия связана не только с объяснением мира, но и с верой, культом и практикой."}, {"id": "1-2", "text": "Что объединяет мифологию и религию?", "options": ["Ориентация человека в мире и обращение к сверхъестественному", "Обязательная экспериментальная проверка", "Отсутствие норм поведения"], "explain": "Обе формы помогают осмысливать мир, жизнь, смерть, добро и зло."}, {"id": "1-3", "text": "Почему неверно называть древний миф «просто сказкой»?", "options": ["Он был значимым объяснением мира и носителем норм", "Он всегда был научной гипотезой", "Он не имел отношения к жизни общества"], "explain": "Для носителей мифологического сознания миф обладал жизненной и культурной значимостью."}], "source": "Мировоззрение существовало не всегда в форме философии. В истории человечества раньше появились мифология и религия. Их называют историческими типами мировоззрения, потому что они возникли на определённых этапах развития общества.\n\nПервым важным типом была мифология. Мифология — это система мифов, с помощью которых древние люди объясняли окружающий мир, происхождение человека, природные явления и устройство общества.\n\nДля мифологического мировоззрения характерно то, что природные и сверхъестественные явления часто не разделялись. Например, гром мог объясняться действиями бога, а смена времён года — поступками сверхъестественных существ.\n\nМиф был для древнего человека не просто сказкой. Он помогал объяснить то, чего человек пока не мог объяснить научным способом. Кроме того, мифы передавали представления народа о добре и зле, правила поведения, традиции и отношение к окружающему миру.\n\nПозже большое значение приобретает религия. Религия основана на вере в существование сверхъестественного — например, Бога, богов или других духовных сил. В религии большое значение имеют вера, религиозные обряды, нормы поведения и представление о связи человека с высшими силами.\n\nМежду мифологией и религией есть сходство: и там и там присутствует вера в сверхъестественное и стремление объяснить мир. Но религия в большей степени связана именно с верой, поклонением и религиозной практикой.\n\nИ мифология, и религия выполняли важную функцию: они помогали человеку ориентироваться в мире и объяснять происходящее. Кроме того, они давали ответы на вопросы о происхождении мира, жизни и смерти, добре и зле.\n\nТаким образом, мифология и религия были важными историческими формами мировоззрения. Они подготовили почву для появления философии, поскольку человек постепенно начал не только верить в объяснение мира, но и задавать вопросы о том, почему мир устроен именно так.\n\nМифология → объяснение мира через мифы и сверхъестественное.\n\nРелигия → вера в сверхъестественное + обряды + нормы поведения.\n\nФилософия → попытка осмыслить мир с помощью рассуждения."}, {"title": "Философия как мировоззрение", "scene": "Страж принимает только ответы с основаниями. Открой дверь вопросом «почему?».", "notes": ["Философия — особый вид мировоззрения, осмысляющий общие вопросы мира, человека и общества с помощью разума и аргументации. Слово означает «любовь к мудрости».", "Философская мысль не ограничивается мнением: она требует оснований, анализирует понятия, сравнивает позиции и критически проверяет убеждения.", "В отличие от частных наук философия ставит предельно общие вопросы. Её не свести ни к мифу, ни к вере. Разные обоснованные ответы могут сосуществовать. Философские традиции возникали также в Индии и Китае; греческая — одна из них."], "memory": "Общие вопросы + разум + аргументы + критика.", "oral": ["Определи философию и переведи её название.", "Назови вопросы о мире, истине, человеке, добре и свободе.", "Отличи аргументированное суждение от простого мнения.", "Сравни философию с мифологией и религией."], "questions": [{"id": "2-0", "text": "Что буквально означает слово «философия»?", "options": ["Любовь к мудрости", "Точное измерение природы", "Искусство победы любой ценой"], "explain": "Традиционный перевод греческого слова — «любовь к мудрости»."}, {"id": "2-1", "text": "Собеседник говорит: «Это правильно, потому что я так чувствую». Какой ход философский?", "options": ["Спросить об основаниях и проверить аргументы", "Принять мнение без обсуждения", "Заменить вопрос рассказом о богах"], "explain": "Философия требует обоснования и критической проверки, а не только выражения мнения."}, {"id": "2-2", "text": "Какой вопрос наиболее философский?", "options": ["Что делает знание истинным?", "Какова температура воды сейчас?", "Сколько страниц в этом учебнике?"], "explain": "Философия исследует общие основания знания; остальные вопросы решаются конкретным измерением или подсчётом."}, {"id": "2-3", "text": "Разные философы дали разные ответы. Следует ли, что философия — произвольное мнение?", "options": ["Нет: важны аргументы и критический анализ", "Да: обоснование никогда не нужно", "Да: все ответы автоматически равноценны"], "explain": "Множественность позиций не отменяет требований к логике и основаниям."}], "source": "Философия является особым видом мировоззрения. Она также пытается ответить на самые общие вопросы о мире, человеке и его жизни, но делает это прежде всего с помощью разума, рассуждения и аргументации.\n\nФилософия появилась в Древней Греции, когда люди начали искать рациональные объяснения происходящему, а не ограничиваться мифологическими рассказами. Само слово «философия» обычно переводится как «любовь к мудрости».\n\nФилософию интересуют самые общие и важные вопросы. Например: Что такое мир? Что такое человек? Что такое истина? Можно ли познать мир? Что такое добро и справедливость? Свободен ли человек? В чём смысл жизни?\n\nПри этом философия отличается от обычного мнения. Если человек говорит: «Я считаю, что это правильно», философия задаёт следующий вопрос: «Почему ты так считаешь?» То есть философское мышление требует обоснования своих взглядов.\n\nФилософия также отличается от мифологии и религии. Мифология объясняет мир через мифы, а религия основывается прежде всего на вере. Философия же стремится исследовать и обосновывать свои положения с помощью мышления. Конечно, философы тоже могут обращаться к вопросам религии и веры, но они рассматривают их как философские проблемы.\n\nПри этом философия не ограничивается одной областью. Она изучает природу мира, человека, познание, мораль, общество, искусство и многие другие вопросы. Поэтому существуют разные разделы философии.\n\nОсобенность философии ещё и в том, что она не всегда даёт один окончательный ответ. Разные философы могут по-разному отвечать на один и тот же вопрос. Но именно в этом и заключается философское мышление: ставить вопросы, анализировать разные позиции и пытаться найти обоснованный ответ.\n\nТаким образом, философия — это особый вид мировоззрения, который стремится осмыслить наиболее общие вопросы о мире, человеке и обществе с помощью разума и критического мышления.\n\nДля запоминания:\n\nФилософия = общие вопросы + разум + аргументы + критическое мышление."}, {"title": "Человек и его бытие", "scene": "В зеркальном зале Архив спрашивает: «Кто ты — и как отвечаешь за свой выбор?».", "notes": ["Человек — центральная философская проблема, потому что способен осмысливать собственное существование, задавать вопросы о себе и смысле жизни.", "Сократ связан с самопознанием и исследованием нравственных убеждений. Декарт — с формулой «Мыслю, следовательно, существую».", "Экзистенциализм выделяет свободу, выбор, ответственность, тревогу, конечность и смысл жизни. Человек живёт в обществе и культуре, но способен оценивать их влияние и выбирать."], "memory": "Самопознание → сознание → свобода → выбор → ответственность → смысл.", "oral": ["Объясни способность человека осмысливать своё бытие.", "Свяжи Сократа с самопознанием, Декарта — с мышлением.", "Раскрой свободу, выбор и ответственность.", "Покажи связь личного существования с обществом и культурой."], "questions": [{"id": "3-0", "text": "Кто связан с формулой «Мыслю, следовательно, существую»?", "options": ["Рене Декарт", "Конфуций", "Эпикур"], "explain": "У Декарта достоверность собственного существования обнаруживается в акте мышления."}, {"id": "3-1", "text": "Ты выбираешь профессию, испытывая тревогу и осознавая ответственность. Какие темы здесь главные?", "options": ["Экзистенциальные: свобода, выбор, смысл", "Только поиск физического первоначала", "Только культ предков"], "explain": "Экзистенциализм ставит в центр переживание собственного существования и ответственность за выбор."}, {"id": "3-2", "text": "Почему человек становится особой проблемой философии?", "options": ["Он может осмысливать себя и собственное существование", "Он существует вне общества и культуры", "Он не способен спрашивать о смысле"], "explain": "Рефлексия позволяет человеку поставить вопрос о своём бытии, ценностях и предназначении."}, {"id": "3-3", "text": "Какой призыв связан с сократовской традицией?", "options": ["Познай самого себя", "Всегда следуй мнению большинства", "Избегай любых вопросов"], "explain": "Сократ исследовал убеждения и поступки, побуждая к самопознанию."}], "source": "Человек занимает особое место в философии, потому что философия интересуется не только тем, что существует в мире, но и тем, как человек существует в этом мире.\n\nВопрос о человеке появляется практически на протяжении всей истории философии. Философов интересует, что такое человек, чем он отличается от других живых существ, свободен ли он, способен ли самостоятельно выбирать свою жизнь и в чём заключается её смысл.\n\nОсобенность человека заключается в том, что он способен задумываться о самом себе. Человек не просто живёт, работает и удовлетворяет свои потребности. Он может спросить: «Кто я? Зачем я живу? Правильно ли я поступаю? Что делает мою жизнь осмысленной?»\n\nОдним из философов, уделявших большое внимание человеку, был Сократ. Его связывают с идеей самопознания и призывом «Познай самого себя». Сократ считал, что человек должен исследовать свои убеждения и поступки и постоянно задавать себе вопросы о добре, справедливости и правильной жизни.\n\nПозже большое значение приобретает проблема сознания. Например, Декарт связывал существование человека с его способностью мыслить. Его знаменитая формула «Мыслю, следовательно, существую» показывает, насколько важным для понимания человека стало его сознание.\n\nВ философии существования, или экзистенциализме, внимание обращается на свободу, выбор, ответственность, тревогу, конечность жизни и поиск смысла. Человек постоянно принимает решения, а значит, несёт ответственность за собственную жизнь.\n\nПри этом человек существует не отдельно от мира. Он живёт среди других людей, находится под влиянием общества и культуры, но при этом способен самостоятельно оценивать свою жизнь и делать выбор.\n\nТаким образом, человек становится центральной проблемой философии потому, что через него можно рассматривать сразу множество вопросов: существование, сознание, познание, свободу, ответственность и смысл жизни. Человек не просто существует, а способен осмысливать своё существование.\n\nДля запоминания:\n\nЧеловек → сознание → самопознание → свобода → выбор → ответственность → смысл жизни."}, {"title": "Материализм, идеализм, дуализм", "scene": "Перед тобой три ключа: материя, идея и два самостоятельных начала. Не перепутай замки.", "notes": ["Материализм: материя первична; мир существует независимо от сознания, а сознание связано с развитием материи и деятельностью мозга.", "Идеализм: первично духовное начало. Объективный идеализм признаёт духовную основу независимо от индивидуального сознания; пример — идеи Платона. Субъективный делает исходным индивидуальное сознание.", "Дуализм: материальное и духовное рассматриваются как два самостоятельных начала. Классический пример — различение тела и мыслящего сознания у Декарта."], "memory": "Материализм — материя. Идеализм — духовное. Дуализм — два начала.", "oral": ["Поставь вопрос о соотношении материи и сознания.", "Объясни первичность материи в материализме.", "Определи идеализм и различи объективное и субъективное духовное начало.", "Опиши дуализм на примере Декарта."], "questions": [{"id": "4-0", "text": "«Сознание — результат развития материи». Какая позиция?", "options": ["Материализм", "Идеализм", "Дуализм"], "explain": "Материалистическое объяснение выводит сознание из материальных процессов."}, {"id": "4-1", "text": "Почему Платона относят к объективному идеализму?", "options": ["Мир идей существует независимо от отдельного человека", "Он считает идеи продуктом только моего воображения", "Он отрицает любые духовные основания"], "explain": "Объективный идеализм признаёт духовную основу, не зависящую от индивидуального сознания."}, {"id": "4-2", "text": "«Тело и мыслящее сознание — два самостоятельных начала». Это…", "options": ["Дуализм", "Материализм", "Только мифология"], "explain": "Дуализм не сводит одно из двух начал к другому; классический представитель — Декарт."}, {"id": "4-3", "text": "Чем различаются материализм и идеализм в этом вопросе?", "options": ["Тем, что признаётся первичным: материальное или духовное", "Тем, любит ли человек материальные блага", "Тем, имеет ли человек нравственные идеалы"], "explain": "Здесь «материализм» — не жадность, а «идеализм» — не мечтательность: это ответы на вопрос о первичности."}], "source": "Одним из главных вопросов философии является вопрос о том, что является первичным: материя или сознание. Разные ответы на этот вопрос привели к формированию таких философских направлений, как материализм, идеализм и дуализм.\n\nМатериализм считает первичной материю. Это означает, что материальный мир существует независимо от человеческого сознания, а сознание рассматривается как результат развития материи. Например, человек сначала существует как материальное существо, а его мышление и сознание связаны с деятельностью мозга.\n\nГлавная идея материализма заключается в том, что материя первична, а сознание вторично. То есть сначала существует объективный мир, а затем возникает его отражение в сознании человека.\n\nИдеализм, наоборот, отдаёт первенство духовному, сознанию или идее. В рамках идеализма считается, что духовное начало имеет основополагающее значение для существования и понимания мира. При этом существуют разные формы идеализма. Одни философы связывают первичность с индивидуальным сознанием, другие — с объективным духовным началом, существующим независимо от отдельного человека.\n\nНапример, объективный идеализм связан с идеей существования некоторого общего духовного начала. Ярким представителем такого подхода был Платон, который говорил о мире идей.\n\nЕсть и третья позиция — дуализм. Само слово означает «двойственность». Дуализм рассматривает материальное и духовное начала как два самостоятельных начала. Наиболее известным представителем дуализма был Рене Декарт, который различал материальное тело и мыслящее сознание.\n\nТаким образом, материализм, идеализм и дуализм предлагают разные ответы на вопрос о соотношении материи и сознания. Материализм считает первичной материю, идеализм — духовное начало, а дуализм признаёт два самостоятельных начала: материальное и духовное.\n\nДля запоминания:\n\nМатериализм → материя первична.\n\nИдеализм → идея/духовное первично.\n\nДуализм → материя + сознание как два начала."}, {"title": "Функции философии", "scene": "В мастерской сломаны семь инструментов. Узнай назначение каждого.", "notes": ["Мировоззренческая функция формирует общее видение мира и человека; познавательная исследует знание, истину и границы познания.", "Методологическая осмысляет общие принципы и способы исследования; ценностная помогает понимать добро, свободу, достоинство и значимость целей.", "Критическая проверяет основания убеждений. Воспитательная и гуманистическая развивают самостоятельное мышление, ответственность и уважение к человеку. Функции связаны друг с другом."], "memory": "Мир — знание — метод — ценности — критика — воспитание — человек.", "oral": ["Объясни, что функция — это роль философии.", "Перечисли мировоззренческую, познавательную и методологическую.", "Раскрой ценностную и критическую функции.", "Добавь воспитательную и гуманистическую; приведи примеры."], "questions": [{"id": "5-0", "text": "«Каковы пределы достоверного знания?» Какая функция на первом плане?", "options": ["Познавательная", "Только воспитательная", "Только ценностная"], "explain": "Познавательная функция рассматривает истину, возможности и границы познания."}, {"id": "5-1", "text": "«Мнение большинства ещё нужно обосновать». Какая функция?", "options": ["Критическая", "Только мировоззренческая", "Только гуманистическая"], "explain": "Критическая функция проверяет основания утверждений и не принимает их автоматически."}, {"id": "5-2", "text": "Сравниваем свободу, достоинство и справедливость как жизненные ориентиры. Это…", "options": ["Ценностная функция", "Методологическая функция в узком смысле", "Измерительная функция"], "explain": "Ценностная функция помогает осмыслить важное, должное и значимое."}, {"id": "5-3", "text": "Что лучше выражает гуманистическую функцию?", "options": ["Уважение к человеку и его достоинству", "Замена всех наук философией", "Безусловное подчинение любому авторитету"], "explain": "Гуманистическая функция обращена к человеку, его достоинству и ответственным отношениям."}], "source": "Философия выполняет в обществе несколько важных функций. Под функцией понимается то, какую роль философия выполняет для человека и общества.\n\nПервая функция — мировоззренческая. Она заключается в том, что философия помогает человеку сформировать общее представление о мире, человеке и его месте в мире. Философия заставляет задумываться над вопросами о смысле жизни, добре, свободе, истине и человеческом предназначении.\n\nВторая — познавательная функция. Философия помогает понять, как человек получает знания и насколько эти знания достоверны. Она ставит вопросы: можно ли познать мир, что такое истина и где находятся границы человеческого познания.\n\nТретья — методологическая функция. Философия помогает разрабатывать общие способы и принципы мышления и познания. То есть она помогает понять, как правильно исследовать проблему и каким образом строить рассуждение.\n\nЧетвёртая — ценностная функция. Философия помогает человеку разобраться в том, что является важным и значимым. Она рассматривает такие ценности, как добро, справедливость, свобода, достоинство и ответственность.\n\nПятая — критическая функция. Философия учит не принимать любые утверждения на веру, а задавать вопросы и проверять основания своих убеждений. Например, если человек говорит: «Все так думают», философия может спросить: «А почему мнение большинства обязательно является правильным?»\n\nТакже философия выполняет воспитательную и гуманистическую функции. Она способствует развитию самостоятельного мышления, помогает человеку лучше понимать себя и других людей и формирует ответственное отношение к своим поступкам.\n\nТаким образом, философия выполняет множество функций: мировоззренческую, познавательную, методологическую, ценностную, критическую, воспитательную и гуманистическую. Все они связаны с одной общей задачей — помочь человеку осмыслить мир и своё место в нём.\n\nДля запоминания:\n\nМир → познание → метод → ценности → критика → воспитание → человек."}, {"title": "Методологическая функция", "scene": "Учёный нашёл ответ без доказательств. Помоги ему построить надёжное исследование.", "notes": ["Метод — способ изучения проблемы. Методология осмысляет методы и общие принципы познания.", "Философия спрашивает: что исследуем, какими средствами, на каких основаниях делаем вывод и где границы результата? Важны логичность, последовательность, проверка предпосылок.", "Примеры способов мышления: анализ — разделение целого; синтез — соединение элементов; сравнение — поиск общего и различного; обобщение — выделение общего; диалектика — рассмотрение связей, противоречий и развития. Философия не заменяет инструкцию конкретного эксперимента."], "memory": "Что изучаю? → как изучаю? → чем обосновываю? → где предел?", "oral": ["Определи метод и методологию.", "Объясни роль общих принципов познания.", "Приведи примеры: анализ, синтез, сравнение, обобщение.", "Различи методологическое осмысление и конкретную научную инструкцию."], "questions": [{"id": "6-0", "text": "Исследователь разбил сложную проблему на части. Это…", "options": ["Анализ", "Синтез", "Религиозный обряд"], "explain": "Анализ выделяет части; синтез соединяет их в целое."}, {"id": "6-1", "text": "Теперь он соединил результаты в целостное объяснение. Это…", "options": ["Синтез", "Анализ", "Воздержание от суждений"], "explain": "Синтез объединяет выделенные элементы и результаты."}, {"id": "6-2", "text": "Какой вопрос методологический?", "options": ["Какие основания и методы делают вывод надёжным?", "Какой цвет нравится исследователю?", "Как называется соседняя улица?"], "explain": "Методология исследует способы, основания и границы познания."}, {"id": "6-3", "text": "Должна ли философия давать готовую инструкцию каждому эксперименту?", "options": ["Нет: она осмысляет общие принципы и методы", "Да: она заменяет все специальные методы", "Нет: она вообще не связана с познанием"], "explain": "Философская методология не подменяет конкретную науку, но помогает осмыслить её исследовательскую работу."}], "source": "Методологическая функция философии связана с тем, что философия помогает человеку и науке правильно организовать процесс познания.\n\nЧтобы понять это проще, сначала нужно разобраться, что такое метод. Метод — это способ, с помощью которого мы изучаем какую-либо проблему. Например, если учёный хочет проверить определённую гипотезу, он использует наблюдение, эксперимент, сравнение или другие способы исследования.\n\nФилософия не заменяет конкретные научные методы, но помогает осмыслить общие принципы познания и мышления. Она задаёт вопросы: что мы изучаем? Как мы можем это познать? Какие способы исследования подходят? Можно ли доверять полученному результату? Какие существуют границы нашего знания?\n\nНапример, философия помогает обратить внимание на необходимость логичности и последовательности мышления. Если человек делает вывод, он должен иметь основания для этого вывода. Нельзя просто сказать: «Я так думаю, значит, это правда».\n\nМетодологическая функция также связана с анализом различных способов мышления. Философия рассматривает такие подходы, как анализ и синтез, сравнение, обобщение, диалектика и другие способы исследования.\n\nОсобенно важна эта функция для науки. Научное знание развивается не только благодаря отдельным открытиям, но и благодаря пониманию того, как правильно ставить вопросы, строить гипотезы, проверять результаты и объяснять полученные данные.\n\nТаким образом, методологическая функция философии заключается в том, что она помогает вырабатывать общие принципы и способы познания, анализировать методы исследования и осмысливать границы и возможности человеческого мышления.\n\nПри этом важно понимать, что философия не даёт учёному готовую инструкцию для каждого конкретного эксперимента. Её задача более общая: помочь понять, как устроен сам процесс познания и на каких принципах он должен строиться.\n\nДля запоминания:\n\nМетодология = как познавать → как мыслить → как проверять → где границы знания."}, {"title": "Философия и наука", "scene": "Две лаборатории спорят о главенстве. Восстанови союз конкретного знания и общих вопросов.", "notes": ["Науки изучают конкретные области действительности специальными методами. Для эмпирических наук особенно важны наблюдение, эксперимент и проверка фактов.", "Философия исследует общие основания: что такое знание, истина, причина, человек; анализирует понятия и аргументы. В древности многие знания ещё не были отдельными дисциплинами.", "Науки постепенно обособились. Философия не заменяет их: осмысляет методы, границы, значение и этические последствия открытий. Философские выводы тоже требуют обоснования."], "memory": "Наука — конкретная область и специальные методы. Философия — основания, границы и смысл.", "oral": ["Покажи общее стремление к познанию.", "Различи предметы и способы исследования.", "Опиши историческое обособление наук.", "Объясни методологическую и этическую связь сегодня."], "questions": [{"id": "7-0", "text": "Физик измеряет ускорение, философ обсуждает понятие причины. Что это показывает?", "options": ["Различие конкретной задачи и общего основания", "Что философия заменяет физику", "Что науке не нужны доказательства"], "explain": "Физика решает специальную задачу; философия осмысляет общие понятия и основания."}, {"id": "7-1", "text": "Какова современная связь философии и наук?", "options": ["Осмысление оснований, методов, границ и последствий", "Полная замена наук философией", "Полное отсутствие общих вопросов"], "explain": "Различие дисциплин не исключает их взаимодействия."}, {"id": "7-2", "text": "Учёные обсуждают допустимость новой технологии для человека. Какой вклад даёт философия?", "options": ["Этический анализ ответственности и последствий", "Только измерение массы оборудования", "Отказ от любого обоснования"], "explain": "Философия помогает осмыслить нравственную сторону научно-технического развития."}, {"id": "7-3", "text": "Как исторически менялись отношения наук и философии?", "options": ["Специальные науки постепенно обособлялись", "Все науки всегда существовали в нынешнем виде", "Философия появилась только после современных лабораторий"], "explain": "В древности многие области знания не были обособлены; позже сформировались самостоятельные науки."}], "source": "Философия и наука тесно связаны между собой, потому что обе стремятся получать знания о мире и человеке. Однако у них есть различия в задачах, способах исследования и характере вопросов.\n\nНаука обычно изучает конкретные области действительности. Например, физика изучает физические процессы, биология — живые организмы, химия — вещества и их взаимодействия. Каждая наука имеет свой предмет исследования и использует специальные методы.\n\nФилософия рассматривает более общие вопросы. Она может спрашивать, что такое знание вообще, что такое истина, каковы возможности человеческого познания, что такое причина, закономерность, человек и общество.\n\nПри этом философия исторически была тесно связана с развитием науки. В древности многие знания вообще не разделялись на отдельные науки. Философы одновременно рассуждали о природе, человеке, математике и устройстве мира.\n\nСо временем отдельные науки стали постепенно отделяться от философии. Появились специальные методы исследования и самостоятельные научные дисциплины. Поэтому сегодня философия не может заменить физику, биологию или историю и не должна пытаться решать их конкретные задачи вместо учёных.\n\nОднако философия сохраняет связь с наукой. Она помогает осмысливать научное знание, рассматривать его основания, методы и границы. Кроме того, философия может анализировать последствия научных открытий. Например, развитие новых технологий может поставить вопросы о том, что допустимо с нравственной точки зрения и какую ответственность несёт человек.\n\nЕсть различие и в способе проверки знаний. Наука опирается на наблюдение, эксперимент, доказательства и проверку фактов. Философия в большей степени использует логическое рассуждение, анализ понятий и аргументацию. При этом философские выводы тоже должны быть обоснованными.\n\nТаким образом, философия и наука — это разные, но связанные формы познания. Наука изучает конкретные области мира и получает специальное знание, а философия рассматривает наиболее общие вопросы о мире, человеке, познании и самом научном знании. Поэтому философия не заменяет науку, а помогает осмыслить её основания, возможности и значение для человека и общества.\n\nДля запоминания:\n\nНаука → конкретное + специальные методы + проверка.\n\nФилософия → общее + рассуждение + осмысление оснований и границ."}, {"title": "Древнеиндийская философия", "scene": "В индийском зале школы распределены неверно. Найди настоящий критерий: отношение к Ведам.", "notes": ["Веды — авторитетные священные тексты древнеиндийской традиции. Упанишады усиливают вопросы о человеке, высшей реальности и освобождении.", "Карма — связь поступков с последствиями; сансара — круг рождений и смертей; освобождение — выход из этого круга. Эти идеи по-разному понимаются школами, а не одинаково принимаются всеми.", "Признают авторитет Вед: ньяя, вайшешика, санкхья, йога, миманса, веданта. Не признают: буддизм, джайнизм, чарвака-локаята. «Неортодоксальный» здесь не значит «неправильный» и не означает просто атеизм.", "Санкхья различает духовное начало и природу; йога выделяет самодисциплину; веданта — абсолютную реальность; джайнизм — очищение и освобождение души. Чарвака — материалистическая традиция."], "memory": "Веды: 6 «да» — ньяя, вайшешика, санкхья, йога, миманса, веданта; 3 «нет» — буддизм, джайнизм, чарвака.", "oral": ["Расскажи о Ведах и Упанишадах.", "Дай определения кармы, сансары и освобождения.", "Назови критерий и все шесть ортодоксальных школ.", "Назови три неортодоксальные школы и различия некоторых учений."], "questions": [{"id": "8-0", "text": "Как разделяют ортодоксальные и неортодоксальные школы Индии?", "options": ["По признанию авторитета Вед", "По вере исключительно в одного бога", "По месту рождения основателя"], "explain": "Критерий — авторитет Вед, а не «правильность» школы или просто наличие веры в бога."}, {"id": "8-1", "text": "Какой набор полностью ортодоксальный?", "options": ["Ньяя, вайшешика, санкхья, йога, миманса, веданта", "Буддизм, джайнизм, чарвака", "Стоицизм, эпикуреизм, кинизм"], "explain": "Эти шесть школ традиционно признают авторитет Вед."}, {"id": "8-2", "text": "Что обозначает сансара?", "options": ["Круг рождений и смертей", "Нравственный пример правителя", "Мир платоновских идей"], "explain": "Сансара — круг перерождений; карма связана с последствиями поступков."}, {"id": "8-3", "text": "В каком наборе только неортодоксальные школы?", "options": ["Буддизм, джайнизм, чарвака-локаята", "Веданта, йога, ньяя", "Санкхья, миманса, вайшешика"], "explain": "Эти три традиции не признают авторитет Вед; их собственные учения существенно различаются."}], "source": "Древнеиндийская философия сформировалась примерно в середине I тысячелетия до нашей эры и была тесно связана с религиозными представлениями. В отличие от европейской философии, здесь философские вопросы долгое время рассматривались вместе с вопросами о религии, морали, человеке и смысле жизни.\n\nБольшое значение для древнеиндийской культуры имели Веды — священные тексты, в которых содержались религиозные представления, обряды и идеи об устройстве мира. Позднее появляются Упанишады, где всё больше внимания уделяется философским вопросам: что такое человек, что представляет собой высшая реальность, почему человек страдает и как можно освободиться от страданий.\n\nОдной из важных идей древнеиндийской философии является представление о карме. Карма означает, что поступки человека имеют последствия и влияют на его дальнейшее существование. С этим связано понятие сансары — круга рождений и смертей. Человек оказывается включённым в этот круг и стремится к освобождению из него.\n\nВ древнеиндийской философии традиционно выделяют ортодоксальные и неортодоксальные школы. Ортодоксальными называются те учения, которые признавали авторитет Вед. К ним относятся шесть основных школ: ньяя, вайшешика, санкхья, йога, миманса и веданта.\n\nНеортодоксальными называются учения, которые не признавали авторитет Вед. К ним относятся прежде всего буддизм, джайнизм и чарвака-локаята. При этом слово «неортодоксальные» здесь означает именно отношение к Ведам, а не то, что эти учения были неправильными.\n\nШколы древнеиндийской философии по-разному отвечали на вопросы о мире и человеке. Например, санкхья рассматривала различие между духовным началом и природой, йога уделяла большое внимание практике самодисциплины и освобождения, а веданта развивала идеи об абсолютной реальности и связи человека с ней.\n\nОсобое место занимают буддизм и джайнизм. Они критиковали некоторые традиционные представления и предлагали собственные пути освобождения человека. Буддизм связывал освобождение с преодолением страдания и желаний, а джайнизм — с нравственным очищением и освобождением души.\n\nТаким образом, древнеиндийская философия в основном была сосредоточена на вопросах человека, страдания, нравственности, перерождения и освобождения. Её важной особенностью является тесная связь философии, религии и практики жизни.\n\nДля запоминания: Веды → Упанишады → карма → сансара → освобождение → ортодоксальные и неортодоксальные школы."}, {"title": "Философия буддизма", "scene": "Четыре двери ведут из зала страдания. Пройди от проблемы к пути освобождения.", "notes": ["Буддизм связан с Сиддхартхой Гаутамой — Буддой («пробуждённым»), VI–V вв. до н. э. Центральна проблема страдания и освобождения.", "Четыре благородные истины: есть страдание; у него есть причина — жажда и привязанность; возможно его прекращение; к прекращению ведёт путь. Это не призыв отказаться от любых полезных стремлений.", "Восьмеричный путь: правильные понимание, намерение, речь, действие, образ жизни, усилие, осознанность и сосредоточение.", "Всё изменчиво; неизменное вечное индивидуальное «я» отрицается. Нирвана — прекращение жажды и страдания, освобождение от круговорота перерождений."], "memory": "Страдание → причина → прекращение → путь. Понимание, намерение; речь, действие, жизнь; усилие, осознанность, сосредоточение.", "oral": ["Назови Будду и центральную проблему.", "Последовательно раскрой четыре истины.", "Перечисли восемь звеньев пути.", "Расскажи об изменчивости, отсутствии неизменного «я» и нирване."], "questions": [{"id": "9-0", "text": "Каков порядок Четырёх благородных истин?", "options": ["Страдание → причина → прекращение → путь", "Путь → награда → богатство → власть", "Причина → вечная душа → наказание → страдание"], "explain": "Сначала устанавливается проблема, затем её причина, возможность прекращения и путь."}, {"id": "9-1", "text": "Что ведёт к прекращению страдания в этом учении?", "options": ["Восьмеричный путь", "Накопление как можно большего числа желаний", "Ожидание вечной неизменности вещей"], "explain": "Путь объединяет мудрость, нравственное поведение и работу с сознанием."}, {"id": "9-2", "text": "Какое утверждение согласуется с буддизмом?", "options": ["Всё изменчиво, неизменного вечного индивидуального «я» нет", "Каждая вещь абсолютно неизменна", "Освобождение требует усиливать привязанности"], "explain": "Изменчивость и отсутствие неизменного «я» — важные положения буддийской мысли."}, {"id": "9-3", "text": "Какой ряд содержит только звенья Восьмеричного пути?", "options": ["Правильные речь, действие, образ жизни, осознанность", "Богатство, слава, господство, роскошь", "Вода, воздух, апейрон, число"], "explain": "Полный путь: понимание, намерение, речь, действие, образ жизни, усилие, осознанность, сосредоточение."}], "source": "Буддизм возник в Древней Индии примерно в VI–V веках до нашей эры. Его возникновение связано с именем Сиддхартхи Гаутамы, которого называют Буддой. Слово «Будда» означает «пробуждённый» или «просветлённый».\n\nГлавной проблемой буддийской философии является страдание человека и возможность освобождения от него. Будда исходил из того, что обычная человеческая жизнь связана со страданием. Человек испытывает неудовлетворённость, потому что постоянно чего-то хочет, привязывается к людям и вещам, боится их потерять.\n\nЭта идея выражается в учении о Четырёх благородных истинах. Первая истина говорит о существовании страдания. Вторая объясняет причину страдания — это прежде всего желания и привязанности человека. Третья утверждает, что страдание можно прекратить. Четвёртая показывает путь, который ведёт к освобождению.\n\nЭтот путь называется Восьмеричным путём. Он включает правильное понимание, правильное намерение, правильную речь, правильное действие, правильный образ жизни, правильное усилие, правильную осознанность и правильное сосредоточение.\n\nВажной особенностью буддизма является представление об изменчивости всего существующего. Всё в мире постоянно меняется, поэтому попытка найти абсолютную устойчивость в материальных вещах приводит к страданию.\n\nБуддизм также отвергает представление о неизменной и вечной индивидуальной душе в традиционном смысле. Человек рассматривается как постоянно изменяющееся сочетание процессов и состояний. Поэтому освобождение связано не с сохранением неизменного «я», а с преодолением привязанности к такому представлению о себе.\n\nКонечной целью является нирвана — состояние освобождения от страданий, желаний и зависимости от круговорота перерождений.\n\nТаким образом, буддизм представляет собой не только религию, но и особое философское учение о человеке и его существовании. Его центральная идея заключается в том, что страдание имеет причины, а значит, человек способен изменить своё состояние через изменение своего отношения к желаниям, привязанностям и собственной жизни.\n\nДля запоминания: Будда → страдание → причина — желания → прекращение страдания → Восьмеричный путь → нирвана."}, {"title": "Древнекитайская философия", "scene": "В Поднебесной четыре советника предлагают разные пути к порядку. Определи их школы.", "notes": ["Главные вопросы: как жить, воспитывать человека, управлять государством и сохранять гармонию. Значительное развитие школ относится к VI–V вв. до н. э. и последующим столетиям.", "Конфуцианство — нравственность, воспитание, общественные отношения. Даосизм — Дао и согласие с естественным ходом вещей.", "Моизм (Мо-цзы) — всеобщая забота о людях. Легизм — строгие законы, дисциплина и государственный порядок.", "Инь и Ян — взаимосвязанные, взаимодополняющие противоположные начала; их взаимодействие связано с изменениями мира. Гармония — не полное отсутствие различий."], "memory": "Конфуций — мораль; Лао-цзы — естественность; Мо-цзы — забота; легисты — закон.", "oral": ["Назови практическую и общественную направленность.", "Сопоставь конфуцианство и даосизм.", "Добавь моизм и легизм.", "Объясни гармонию и взаимодополнение Инь и Ян."], "questions": [{"id": "10-0", "text": "Советник предлагает строгие законы и дисциплину. Какую школу он представляет?", "options": ["Легизм", "Даосизм", "Эпикуреизм"], "explain": "Легизм делает акцент на законах и дисциплине как средствах государственного порядка."}, {"id": "10-1", "text": "Кто связан с идеей всеобщей заботы о людях?", "options": ["Мо-цзы и моизм", "Парменид и элеаты", "Декарт и дуализм"], "explain": "Моизм выделяет всеобщую заботу, а не только соблюдение семейной иерархии."}, {"id": "10-2", "text": "Что выражают Инь и Ян?", "options": ["Взаимодействие и взаимодополнение противоположностей", "Два полностью изолированных мира", "Победу неизменного зла над добром"], "explain": "Инь и Ян нельзя просто свести к добру и злу: они соотнесённые начала."}, {"id": "10-3", "text": "Что особенно характерно для древнекитайской философии в программе?", "options": ["Связь морали, практической жизни и общественной гармонии", "Исключительно поиск химического состава вещей", "Полный отказ от вопросов управления"], "explain": "Китайские школы активно обсуждали воспитание человека и порядок общества."}], "source": "Древнекитайская философия сформировалась примерно в VI–V веках до нашей эры. Её развитие происходило в период серьёзных политических и социальных изменений. Поэтому китайские философы большое внимание уделяли не только устройству мира, но и вопросам человека, морали, государства и правильного поведения.\n\nДля древнекитайской философии характерна тесная связь с практической жизнью. Философов интересовало, как человеку правильно жить, как сохранить порядок в обществе и каким должно быть хорошее государство.\n\nОдним из важнейших направлений было конфуцианство, связанное с именем Конфуция. Оно уделяло особое внимание нравственности, воспитанию человека, отношениям между людьми и общественному порядку.\n\nДругим важным направлением был даосизм, связанный прежде всего с Лао-цзы. Центральным понятием здесь является Дао, то есть путь, закономерность или естественный порядок существования мира. Человек должен не бороться с естественным ходом вещей, а стремиться жить в соответствии с Дао.\n\nКроме конфуцианства и даосизма, в Древнем Китае существовали и другие школы. Например, моизм, связанный с Мо-цзы, выступал за всеобщую заботу о людях. Легизм делал акцент на строгих законах и дисциплине как основе государства.\n\nОсобенностью китайской философии является внимание к гармонии. Мир и общество должны находиться в состоянии равновесия. Нарушение правильного порядка приводит к конфликтам и страданиям.\n\nБольшое значение имели понятия Инь и Ян, которые выражают взаимодействие противоположных начал. Инь и Ян не просто противостоят друг другу, а дополняют друг друга. Их взаимодействие объясняет изменение и развитие мира.\n\nТаким образом, древнекитайская философия была направлена прежде всего на поиск гармонии — между человеком и природой, человеком и обществом, отдельными людьми и различными сторонами жизни. Её главными направлениями стали конфуцианство, даосизм, моизм и легизм.\n\nДля запоминания: общество → мораль → гармония → конфуцианство → даосизм → Инь и Ян → другие школы."}, {"title": "Социально-этическое учение Конфуция", "scene": "Правитель просит восстановить доверие. Начни не с наказаний, а с нравственного примера.", "notes": ["Конфуций (VI–V вв. до н. э.) связывает общественный порядок с нравственным совершенствованием человека. От личности и семьи — к государству.", "Жэнь — человечность, гуманность; ли — правила, ритуалы и нормы поведения. Уважение и забота о родителях выражают сыновнюю почтительность.", "Благородный человек — нравственно развитый, сдержанный, ответственный, а не просто знатный по происхождению. Правитель должен воспитывать личным примером: наказаний недостаточно."], "memory": "Жэнь — человечность. Ли — нормы. Семья → личный пример → гармония государства.", "oral": ["Назови нравственное совершенствование основой порядка.", "Определи жэнь и ли.", "Раскрой сыновнюю почтительность и благородного человека.", "Объясни роль нравственного примера правителя."], "questions": [{"id": "11-0", "text": "Совет правителю: «Будь образцом нравственности». Чьё это направление?", "options": ["Конфуцианство", "Легизм в его акценте на наказаниях", "Античный атомизм"], "explain": "Конфуций подчёркивает воспитательную силу нравственного примера."}, {"id": "11-1", "text": "Как соотносятся жэнь и ли?", "options": ["Жэнь — человечность; ли — нормы и ритуалы", "Жэнь — вода; ли — воздух", "Жэнь — закон наказания; ли — удовольствие"], "explain": "Жэнь описывает человечность, ли — упорядоченные формы поведения."}, {"id": "11-2", "text": "Кто такой благородный человек у Конфуция?", "options": ["Нравственно совершенствующийся человек", "Любой богатый человек независимо от поступков", "Только человек знатного происхождения"], "explain": "Нравственное достоинство не сводится к происхождению и богатству."}, {"id": "11-3", "text": "Какой поступок выражает сыновнюю почтительность?", "options": ["Уважение к родителям и забота о них", "Отказ от всех семейных обязанностей", "Стремление к роскоши любой ценой"], "explain": "Семья и уважение к старшим — важная основа конфуцианского порядка."}], "source": "Конфуцианство возникло в Древнем Китае и связано с именем Конфуция, жившего в VI–V веках до нашей эры. Основное внимание Конфуций уделял не устройству природы, а человеку, его нравственности, отношениям с другими людьми и правильному устройству общества.\n\nГлавная мысль Конфуция заключается в том, что порядок в обществе начинается с нравственного совершенствования самого человека. Если человек правильно ведёт себя, уважает других и выполняет свои обязанности, то постепенно порядок устанавливается и в семье, и в государстве.\n\nОдним из важнейших понятий конфуцианства является жэнь. Его можно понимать как человечность, гуманность, доброжелательное отношение к другим людям. Человек должен относиться к другим так, как хотел бы, чтобы относились к нему.\n\nДругое важное понятие — ли, то есть правила поведения, нормы, обычаи и ритуалы. Конфуций считал, что человек должен соблюдать определённые правила поведения, потому что именно они помогают поддерживать порядок в обществе.\n\nБольшое значение Конфуций придавал семье. Он говорил о необходимости уважения к родителям и старшим. Это связано с принципом сыновней почтительности. Человек должен уважать родителей, заботиться о них и выполнять свои обязанности перед семьёй.\n\nКонфуций также рассуждал о государстве. По его мнению, хороший правитель должен прежде всего быть нравственным примером для своих подданных. Государство не может нормально существовать только благодаря наказаниям. Гораздо важнее воспитание людей и личный пример правителя.\n\nОсобое значение имеет идея «благородного человека». Это не обязательно человек знатного происхождения. Благородным является тот, кто обладает нравственными качествами, умеет контролировать себя, уважает других и стремится к совершенствованию.\n\nТаким образом, социально-этическое учение Конфуция строится вокруг идеи нравственного порядка. Если каждый человек будет выполнять свои обязанности, уважать других и совершенствовать себя, то гармония установится в семье, обществе и государстве.\n\nДля запоминания: Конфуций → человек → жэнь → ли → семья → правитель → благородный человек → гармония."}, {"title": "Дао, Лао-цзы и даосизм", "scene": "Усилие не открывает ворота. Найди действие, которое не спорит с природой вещей.", "notes": ["Возникновение даосизма традиционно связывают с Лао-цзы. Дао — всеобщий путь, естественный порядок и основа существования и изменения мира, а не обычное отдельное существо.", "У-вэй («недеяние») — действие без насильственного навязывания, сообразно ситуации и природе вещей. Это не буквальная праздность.", "Естественность, простота, уменьшение лишних желаний и чрезмерного контроля помогают гармонии. Противоположности взаимосвязаны, что выражается через Инь и Ян."], "memory": "Дао — путь. У-вэй — не безделье, а ненасильственное и своевременное действие.", "oral": ["Свяжи Лао-цзы с даосизмом.", "Определи Дао как всеобщий путь и порядок.", "Объясни у-вэй и приведи пример действия без насилия над ходом вещей.", "Раскрой естественность, простоту и связь противоположностей."], "questions": [{"id": "12-0", "text": "Садовник учитывает сезон и свойства растения, а не тянет росток вверх. Какой принцип иллюстрируется?", "options": ["У-вэй", "Ли как общественный ритуал", "Силлогизм"], "explain": "У-вэй — действовать сообразно природе вещей, не форсируя результат."}, {"id": "12-1", "text": "Что такое Дао?", "options": ["Всеобщий путь и естественный порядок мира", "Только имя одного божества", "Способ формального доказательства"], "explain": "Дао — основополагающий путь и порядок, а не обычное конкретное существо."}, {"id": "12-2", "text": "Какое толкование «недеяния» ошибочно?", "options": ["Нужно всегда буквально ничего не делать", "Не стоит насильно навязывать ход событий", "Можно действовать естественно и своевременно"], "explain": "У-вэй не равен полной пассивности; речь о ненасильственном действии."}, {"id": "12-3", "text": "Какой образ жизни ближе к даосскому идеалу из конспекта?", "options": ["Простота, естественность и меньше лишних желаний", "Постоянное господство и чрезмерный контроль", "Бесконечное накопление искусственных ограничений"], "explain": "Даосизм критикует избыточную искусственность и вмешательство."}], "source": "Даосизм — одно из главных направлений древнекитайской философии. Его возникновение традиционно связывают с именем Лао-цзы. Основным понятием даосизма является Дао.\n\nСлово «Дао» буквально означает «путь», но в философии Лао-цзы оно имеет гораздо более глубокий смысл. Дао — это всеобщий путь и естественный порядок мира, закономерность, в соответствии с которой происходит существование и изменение всего.\n\nДао нельзя полностью представить как обычного бога или конкретное существо. Это скорее основа и естественный порядок бытия. Всё возникает, изменяется и развивается в соответствии с Дао.\n\nИз этого следует важная мысль даосизма: человек должен стремиться жить в соответствии с естественным ходом вещей, а не постоянно пытаться насильно изменить мир под себя.\n\nС этим связана идея у-вэй, которую часто переводят как «недеяние». Но это не означает, что человек вообще ничего не должен делать. Смысл в другом: не следует действовать против природы вещей, чрезмерно вмешиваться и пытаться силой добиться результата. Нужно действовать естественно и своевременно.\n\nЛао-цзы также критиковал чрезмерную искусственность общественной жизни. Чем больше человек создаёт ненужных ограничений, желаний и правил, тем дальше он может отходить от естественности.\n\nВ даосизме важны понятия естественности и простоты. Человек должен избавиться от лишних желаний, стремления постоянно конкурировать и господствовать над другими. Тогда он сможет жить более гармонично.\n\nДаосизм также рассматривает взаимодействие противоположностей. Это выражается через представление об Инь и Ян. Противоположности не существуют полностью отдельно друг от друга — они взаимосвязаны и переходят друг в друга.\n\nТаким образом, учение Лао-цзы призывает человека жить в согласии с Дао, сохранять естественность, не стремиться к чрезмерному контролю и избегать насильственного вмешательства в естественный ход событий.\n\nДля запоминания: Дао → путь и порядок мира → естественность → у-вэй → простота → гармония."}, {"title": "Ранняя греческая философия", "scene": "В милетской обсерватории перепутаны первоначала. Верни мыслителям их идеи.", "notes": ["VI–V вв. до н. э.: переход от мифологических рассказов к поиску естественных причин и рациональному объяснению. Милетская школа ищет первоначало — архэ.", "Фалес — вода; Анаксимандр — апейрон (неопределённое, беспредельное); Анаксимен — воздух.", "Гераклит — изменение, взаимодействие и борьба противоположностей, огонь. Парменид — истинное бытие едино и неизменно; чувства могут вводить в заблуждение.", "Пифагорейцы — число, математические отношения и гармония. Основные вопросы: первоначало, бытие, движение и порядок мира."], "memory": "Фалес — вода; Анаксимандр — апейрон; Анаксимен — воздух. Гераклит — изменение; Парменид — неизменное бытие.", "oral": ["Объясни переход к рациональным и естественным причинам.", "Назови милетцев и три первоначала.", "Сопоставь Гераклита и Парменида.", "Раскрой число и гармонию у пифагорейцев."], "questions": [{"id": "13-0", "text": "Какое соответствие верно?", "options": ["Фалес — вода; Анаксимандр — апейрон; Анаксимен — воздух", "Фалес — воздух; Анаксимандр — вода; Анаксимен — число", "Фалес — идея; Анаксимандр — душа; Анаксимен — огонь"], "explain": "Запомни милетскую тройку: вода — беспредельное — воздух."}, {"id": "13-1", "text": "Кто связывает мир с постоянным изменением и огнём?", "options": ["Гераклит", "Парменид", "Конфуций"], "explain": "Гераклит подчёркивает изменение и противоположности; Парменид — неизменность истинного бытия."}, {"id": "13-2", "text": "«Истинное бытие едино и неизменно». Кто ближе к этому тезису?", "options": ["Парменид", "Гераклит", "Эпикур"], "explain": "Парменид различает рассуждение об истинном бытии и обманчивые чувственные впечатления."}, {"id": "13-3", "text": "Какая идея центральна для пифагорейцев?", "options": ["Число и гармония", "Восьмеричный путь", "Жэнь и ли"], "explain": "Математические отношения у пифагорейцев раскрывают порядок мира."}], "source": "Ранняя греческая философия сформировалась в VI–V веках до нашей эры. Её возникновение связывают прежде всего с древнегреческими городами Малой Азии, особенно с Милетом.\n\nГлавной особенностью ранней греческой философии был переход от мифологического объяснения мира к рациональному. Философы стали искать естественные причины происходящего и пытались объяснить устройство мира с помощью рассуждения.\n\nОдними из первых были представители Милетской школы — Фалес, Анаксимандр и Анаксимен. Они искали первоначало, из которого возникает всё существующее.\n\nФалес считал первоначалом воду. Анаксимен связывал начало мира с воздухом, а Анаксимандр говорил об апейроне — неопределённом и беспредельном первоначале.\n\nДругой важный философ — Гераклит. Он считал, что мир постоянно изменяется. Его философию связывают с идеей всеобщего изменения и борьбы противоположностей. Символом изменения для него был огонь.\n\nПротивоположную позицию занимали элеаты, особенно Парменид. Парменид утверждал, что истинное бытие едино и неизменно, а чувственное представление об изменениях может вводить человека в заблуждение.\n\nВажную роль сыграли также пифагорейцы, которые связывали устройство мира с числом и гармонией. Они считали, что математические отношения помогают понять порядок Вселенной.\n\nТаким образом, ранняя греческая философия постепенно формировала рациональное объяснение мира. Её представители искали первоначало, пытались понять изменение и движение, соотношение бытия и небытия, порядок и гармонию мира.\n\nИменно эта философская традиция стала основой для дальнейшего развития античной философии и подготовила появление Сократа, Платона и Аристотеля.\n\nДля запоминания: миф → разум → первоначало → Фалес/Анаксимандр/Анаксимен → Гераклит → Парменид → пифагорейцы."}, {"title": "Софисты и Сократ", "scene": "На агоре идёт спор. Отличи искусство убеждения от совместного поиска истины.", "notes": ["В V веке до н. э. внимание смещается к человеку, языку, знаниям и нравственности. Софисты — платные учителя речи и аргументации для общественной жизни. Их взгляды различались.", "Протагор: «Человек есть мера всех вещей». Восприятие и оценка зависят от человека; убедительность речи ещё не гарантирует истины.", "Сократ исследует добро, справедливость и добродетель. В диалоге вопросами обнаруживает противоречия и побуждает собеседника искать ответ. Важны самопознание, признание незнания и связь знания добра с нравственным поведением."], "memory": "Софисты — речь и убеждение. Протагор — человек-мера. Сократ — вопросы, самопознание, истина.", "oral": ["Опиши софистов и контекст греческой общественной жизни.", "Объясни тезис Протагора.", "Покажи сократовский диалог и поиск противоречий.", "Сравни убеждение с поиском истины, добавь нравственную проблематику."], "questions": [{"id": "14-0", "text": "Кому принадлежит тезис «Человек есть мера всех вещей»?", "options": ["Протагору", "Аристотелю", "Лао-цзы"], "explain": "Протагор — известный софист; тезис связывает оценки и восприятие с человеком."}, {"id": "14-1", "text": "Ты задаёшь собеседнику уточняющие вопросы и обнаруживаешь противоречие. Какой метод ближе?", "options": ["Сократовский диалог", "Слепое следование авторитету", "Только физический эксперимент"], "explain": "Сократ вопросами помогает собеседнику исследовать собственные убеждения."}, {"id": "14-2", "text": "Почему победа в споре не доказывает истину?", "options": ["Убедительность и обоснованность могут не совпадать", "Любая победа автоматически истинна", "Истина зависит только от громкости голоса"], "explain": "Риторический успех не заменяет проверки оснований и логики."}, {"id": "14-3", "text": "Что прежде всего интересовало Сократа?", "options": ["Добро, справедливость, самопознание и добродетель", "Только состав небесных тел", "Только накопление богатства"], "explain": "Сократ сосредоточил философский поиск на нравственной жизни человека."}], "source": "В V веке до нашей эры в греческой философии происходит важное изменение. Философы начинают больше внимания уделять не только природе, но и человеку, обществу, знаниям и нравственности. В этот период большую роль сыграли софисты и Сократ.\n\nСофисты были профессиональными учителями, которые за плату обучали людей искусству речи, спору, аргументации и другим навыкам, необходимым для общественной и политической жизни. Особенно важным это было в условиях греческой демократии, где умение выступать и убеждать имело большое значение.\n\nСофисты обратили внимание на человека и его возможности. Они исследовали язык, знания, общественные нормы и то, как человек воспринимает окружающий мир. Однако взгляды разных софистов не были одинаковыми.\n\nНаиболее известным софистом был Протагор. Ему принадлежит знаменитое положение: «Человек есть мера всех вещей». Смысл этой идеи связан с тем, что восприятие и оценка действительности зависят от человека. То, что одному кажется одним, другому может казаться другим.\n\nСофисты также уделяли большое внимание искусству спора и аргументации. Они показывали, что один и тот же вопрос можно рассматривать с разных сторон. Поэтому возникал вопрос: всегда ли убедительный аргумент означает, что утверждение является истинным?\n\nСократ во многом противопоставлял себя софистам. Его интересовали прежде всего вопросы добра, справедливости, добродетели и правильной жизни. Сократ считал, что человек должен постоянно исследовать самого себя и свои убеждения. С этим связан призыв «Познай самого себя».\n\nГлавным методом Сократа был диалог. Он задавал собеседнику вопросы, помогал обнаружить противоречия в его рассуждениях и заставлял самостоятельно искать ответ. Сократ подчёркивал значение знания собственного незнания. С ним также связывают мысль о том, что понимание добра связано с правильным нравственным поведением.\n\nТаким образом, софисты и Сократ сыграли огромную роль в развитии философии человека. Софисты исследовали человека, язык, знания и искусство убеждения, а Сократ сосредоточился на самопознании, нравственности и поиске истины через диалог.\n\nДля запоминания: софисты → человек → речь → спор → Протагор → Сократ → самопознание → диалог → нравственность."}, {"title": "Философские идеи Платона", "scene": "В пещере за истину принимают тени. Проведи хранителей от видимости к знанию.", "notes": ["Платон — ученик Сократа. Вечные и неизменные идеи — подлинная основа; чувственные вещи изменчивы и несовершенно причастны идеям. Это объективный идеализм.", "Чувства дают впечатления, разум помогает восходить к истинному знанию. Пещера — аллегория перехода от теней и незнания к познанию.", "Три начала души: разумное, волевое, чувственное. Гармония предполагает руководящую роль разума.", "В «Государстве» каждый выполняет свою функцию; править должны философы, стремящиеся к знанию и справедливости."], "memory": "Идеи → чувственные вещи → разум → выход из пещеры → гармония души → философы-правители.", "oral": ["Опиши мир идей и чувственный мир.", "Объясни роль разума и аллегорию пещеры.", "Назови три начала души и их гармонию.", "Раскрой идеальное государство и власть философов."], "questions": [{"id": "15-0", "text": "Почему красивые вещи не равны идее красоты у Платона?", "options": ["Вещи изменчивы, а идея вечна и неизменна", "Идея — только случайный личный вкус", "Красоты вообще не существует"], "explain": "Платон отличает изменчивые проявления от устойчивой идеи."}, {"id": "15-1", "text": "Что символизирует выход из пещеры?", "options": ["Переход от незнания и видимости к знанию", "Отказ от любого мышления", "Достижение богатства"], "explain": "Тени принимаются за реальность; выход означает познавательное восхождение."}, {"id": "15-2", "text": "Какие начала души выделяет Платон?", "options": ["Разумное, волевое, чувственное", "Материальное, химическое, биологическое", "Жэнь, ли, Дао"], "explain": "Гармония души предполагает правильное соотношение трёх начал и руководство разума."}, {"id": "15-3", "text": "Кто должен править в платоновском идеальном государстве?", "options": ["Философы, стремящиеся к знанию и справедливости", "Только самые богатые торговцы", "Любой, кто лучше всех развлекает толпу"], "explain": "Философы-правители связаны с идеей разумного и справедливого устройства государства."}], "source": "Платон — один из крупнейших философов Древней Греции и ученик Сократа. Его философия оказала огромное влияние на последующее развитие европейской мысли.\n\nЦентральное место в философии Платона занимает учение об идеях. Платон считал, что окружающий нас материальный мир постоянно изменяется и поэтому не может быть высшей и полностью истинной реальностью.\n\nНапример, существуют разные красивые вещи: человек, картина, здание. Все они могут быть красивыми, но их красота изменяется и зависит от конкретного предмета. Платон считал, что существует сама идея красоты — вечная и неизменная. То же самое относится к идеям добра, справедливости и других вещей.\n\nТаким образом, Платон различал мир идей и чувственный мир. Мир идей является вечным и совершенным, а материальный мир представляет собой его несовершенное проявление.\n\nС этим связано учение Платона о познании. Человек воспринимает окружающий мир чувствами, но чувственные впечатления не дают полного и истинного знания. Для достижения истины необходимо использовать разум.\n\nИзвестна платоновская аллегория пещеры. Люди в пещере видят только тени предметов и принимают их за реальность. Философ, по Платону, способен выйти из пещеры и увидеть настоящий мир. Эта история символизирует переход человека от незнания к истинному знанию.\n\nПлатон также много рассуждал о человеке. Он выделял в душе три начала: разумное, волевое и чувственное. Гармоничный человек — это человек, у которого эти начала находятся в правильном порядке, а разум способен управлять остальными.\n\nБольшое внимание Платон уделял государству. В работе «Государство» он описывал идеальное государство, в котором каждый выполняет свою функцию. Управлять государством, по его мнению, должны философы, потому что именно они способны стремиться к истинному знанию и справедливости.\n\nТаким образом, основные идеи Платона связаны с учением об идеях, различием чувственного и истинного мира, ролью разума в познании, строением души и представлением об идеальном государстве.\n\nДля запоминания: Платон → идеи → два мира → разум → пещера → душа → идеальное государство → философы-правители."}, {"title": "Философские идеи Аристотеля", "scene": "В Ликее нужно объяснить статую, вырастить семя и выбрать добродетельный поступок.", "notes": ["Аристотель — ученик и критик Платона: форма не отделяется от конкретной вещи в особый мир идей. Вещь — единство материи (из чего) и формы (что она есть).", "Четыре причины: материальная — из чего; формальная — что это; действующая — источник возникновения; целевая — ради чего. Статуя: бронза, облик, скульптор, назначение.", "Изменение — переход от возможности к действительности: семя может стать растением. Аристотель систематизирует логику и силлогизм.", "Эвдемония — полноценная счастливая жизнь через деятельность в соответствии с добродетелью. «Золотая середина» не арифметический компромисс: мужество между трусостью и безрассудством. Человек — «политическое животное», живёт в обществе и государстве."], "memory": "Материя + форма. 4 причины: из чего, что, кем, ради чего. Возможность → действительность. Добродетель → эвдемония.", "oral": ["Сравни материю и форму с отдельным миром идей Платона.", "Назови четыре причины на примере статуи.", "Объясни возможность, действительность и значение логики.", "Раскрой эвдемонию, золотую середину и общественную природу человека."], "questions": [{"id": "16-0", "text": "Какая цепочка правильно объясняет бронзовую статую по четырём причинам?", "options": ["Бронза → облик → скульптор → назначение", "Скульптор → назначение → бронза → облик", "Облик → бронза → назначение → скульптор"], "explain": "Порядок здесь: материальная, формальная, действующая и целевая причины."}, {"id": "16-1", "text": "Семя стало растением. Как это описать у Аристотеля?", "options": ["Переход от возможности к действительности", "Выход в отдельный мир идей", "Полное отсутствие изменений"], "explain": "То, что существовало потенциально, при условиях осуществилось."}, {"id": "16-2", "text": "Мужество находится между трусостью и безрассудством. Это пример…", "options": ["Добродетельной золотой середины", "Обязательного отказа от любых действий", "Удовольствия любой ценой"], "explain": "Золотая середина соотнесена с разумной мерой поступка, а не просто численным средним."}, {"id": "16-3", "text": "Как связаны эвдемония, логика и политика с Аристотелем?", "options": ["Счастливая добродетельная жизнь; силлогизм; человек как общественное существо", "Роскошь; отказ от рассуждения; полная изоляция", "Только мир идей, существующий отдельно от вещей"], "explain": "Аристотель развивал этику добродетели, формальную логику и учение об общественной природе человека."}], "source": "Аристотель был учеником Платона, но во многих вопросах критиковал его философию. Он считается одним из наиболее универсальных мыслителей античности: занимался философией, логикой, природой, человеком, этикой и политикой.\n\nОдним из главных вопросов Аристотеля было устройство бытия. Он считал, что нельзя полностью отделять идеи от вещей. В отличие от Платона, Аристотель не считал, что идеи существуют отдельно в особом мире.\n\nАристотель рассматривал каждую конкретную вещь как единство материи и формы. Материя — это то, из чего состоит вещь, а форма определяет, чем эта вещь является.\n\nБольшое значение имеет также учение Аристотеля о четырёх причинах. Чтобы объяснить вещь, необходимо понять, из чего она состоит, какой она имеет вид или форму, что стало причиной её возникновения и ради чего она существует.\n\nАристотель много внимания уделял движению и изменению. Он связывал их с переходом от возможности к действительности. Например, семя потенциально является растением, но при определённых условиях эта возможность реализуется.\n\nВажное место занимает логика. Аристотель систематизировал правила правильного мышления и разработал учение о силлогизме. Поэтому его считают одним из основателей формальной логики.\n\nВ этике Аристотель рассматривал вопрос о том, в чём заключается счастливая жизнь. Он считал высшей целью человека эвдемонию, то есть счастливую и полноценную жизнь. Она достигается не простым удовольствием, а деятельностью в соответствии с добродетелью.\n\nАристотель также разработал учение о «золотой середине». Добродетель часто находится между двумя крайностями. Например, мужество находится между трусостью и безрассудной храбростью.\n\nВ политике Аристотель рассматривал человека как «политическое животное», то есть существо, которое по своей природе живёт в обществе и государстве. Поэтому полноценная жизнь человека связана с общественными отношениями.\n\nТаким образом, философия Аристотеля охватывает практически все основные области знания. Он исследовал бытие, материю и форму, причины, движение, логику, нравственность и государство.\n\nДля запоминания: Аристотель → материя и форма → четыре причины → возможность и действительность → логика → добродетель → золотая середина → государство."}, {"title": "Эллинистические школы", "scene": "Последний зал охвачен тревогой. Четыре школы учат внутренней свободе разными способами.", "notes": ["После походов Александра Македонского философия особенно обращается к жизни человека в нестабильном мире: как сохранить свободу и спокойствие?", "Стоики — жить согласно природе и разуму, добродетельно выполнять обязанности, различать зависящее и не зависящее от нас. Это не простое подавление чувств.", "Эпикурейцы — удовольствие как отсутствие телесного страдания и душевной тревоги, умеренные желания, дружба и простая жизнь. Атараксия — душевная невозмутимость.", "Скептики — осторожность в притязаниях на достоверность, воздержание от категоричных суждений. Киники (Диоген) — простота, независимость от роскоши и общественных условностей."], "memory": "Стоик — разум и отношение. Эпикуреец — умеренность и дружба. Скептик — воздержание. Киник — простота и независимость.", "oral": ["Объясни исторический контекст и общую проблему спокойной жизни.", "Раскрой стоицизм и эпикуреизм без упрощений.", "Опиши скептическое воздержание от категоричных суждений.", "Назови киников, Диогена и понятие атараксии."], "questions": [{"id": "17-0", "text": "Событие не зависит от тебя. Ты сохраняешь разумное отношение и выполняешь долг. Какая школа?", "options": ["Стоицизм", "Эпикуреизм как культ роскоши", "Милетская школа"], "explain": "Стоики учат не отдавать внутреннюю жизнь во власть неподконтрольных обстоятельств."}, {"id": "17-1", "text": "Что ближе к удовольствию у Эпикура?", "options": ["Отсутствие страдания и тревоги, умеренность и дружба", "Постоянные излишества любой ценой", "Обязательное господство над другими"], "explain": "Эпикурейское удовольствие не сводится к развлечениям и роскоши."}, {"id": "17-2", "text": "Кто предпочитает воздержаться от категоричного суждения при недостатке оснований?", "options": ["Скептик", "Легист", "Пифагореец по определению"], "explain": "Скептики подчёркивают ограниченность знания и воздержание от категоричности."}, {"id": "17-3", "text": "Диоген отвергает роскошь и условности ради независимости. Это…", "options": ["Кинизм", "Объективный идеализм Платона", "Конфуцианство"], "explain": "Киники ищут свободу в простой жизни и независимости от внешних благ. Атараксия — душевное спокойствие, а не название этой школы."}], "source": "Эллинистическая философия сформировалась после походов Александра Македонского, когда греческая культура распространилась на огромные территории. В этот период политическая и социальная ситуация сильно изменилась, поэтому философы стали особенно интересоваться вопросом: как человеку сохранить спокойствие и правильно жить в нестабильном мире.\n\nК основным эллинистическим школам относятся стоицизм, эпикуреизм, скептицизм и кинизм.\n\nСтоики считали, что мир развивается в соответствии с определённым разумным порядком. Человек не может контролировать всё происходящее, но он может контролировать своё отношение к событиям. Поэтому мудрый человек должен спокойно принимать то, что от него не зависит, и правильно выполнять свои обязанности.\n\nВажной для стоицизма является идея жизни в соответствии с природой и разумом. Человек должен управлять своими страстями и не позволять внешним обстоятельствам полностью разрушать его внутреннее состояние.\n\nЭпикурейцы, напротив, связывали счастливую жизнь с достижением удовольствия, но понимали удовольствие не как постоянные развлечения. Для Эпикура важнее всего отсутствие страданий тела и тревог души. Поэтому человеку необходимо ограничивать лишние желания, избегать ненужных страхов и ценить дружбу, спокойствие и простую жизнь.\n\nС этим связано понятие атараксии — душевного спокойствия, освобождения от тревоги.\n\nСкептики обращали внимание на ограниченность человеческого знания. Они считали, что по многим вопросам невозможно получить абсолютно достоверный ответ. Поэтому человеку следует воздерживаться от категоричных суждений. Это должно помочь ему достичь душевного спокойствия.\n\nЕщё одной школой были киники, наиболее известным представителем которых был Диоген. Киники критиковали общественные условности, роскошь и зависимость человека от материальных благ. Они призывали к п const KEY='philosophy-archive-v1';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({done:[],weak:[],earned:[],xp:0,best:null,oral:{}});
let state=fresh(),storageOK=true;
const ALL=TOPICS.flatMap((t,i)=>t.questions.map(q=>({...q,topic:i})));
const findQ=id=>ALL.find(q=>q.id===id);
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.done)&&Array.isArray(x.weak)&&Array.isArray(x.earned)){state={...fresh(),...x};state.done=[...new Set(state.done.filter(i=>Number.isInteger(i)&&i>=0&&i<18))];state.weak=[...new Set(state.weak.filter(findQ))];state.earned=[...new Set(state.earned.filter(findQ))];state.xp=state.earned.length*10;state.oral=state.oral&&typeof state.oral==='object'?state.oral:{};state.best=typeof state.best==='number'?Math.max(0,Math.min(18,state.best)):null}}catch(e){storageOK=false}
let route='home',activeTopic=0,session=null,timer=null,left=90;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false}updateStatus()}
function updateStatus(){const pct=Math.round(state.done.length/18*100);$('#status').innerHTML=`<span>Печати: <b>${state.done.length}/18</b></span><div class="track" role="progressbar" aria-label="Пройденные залы" aria-valuenow="${state.done.length}" aria-valuemin="0" aria-valuemax="18"><div class="fill" style="width:${pct}%"></div></div><span>${state.xp} очков</span><span>Повторить: ${state.weak.length}</span>`;$('#storageNote').textContent=storageOK?'Прогресс сохраняется в этом браузере, если локальное хранение доступно. Квест работает без интернета.':'Браузер не разрешил локальное сохранение. Прогресс доступен только до закрытия или перезагрузки этой вкладки.'}
function shell(r){route=r;clearInterval(timer);timer=null;document.querySelectorAll('.nav').forEach(b=>{const on=b.dataset.action===r;b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});updateStatus()}
function focusPage(){app.focus({preventScroll:true});window.scrollTo(0,0)}
function nextTopic(){const n=TOPICS.findIndex((_,i)=>!state.done.includes(i));return n<0?0:n}

function home(){shell('home');session=null;const n=nextTopic();app.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">Интерактивный учебный квест</div><h1>Верни мудрость<br>в Архив.</h1><p class="muted">Архив потерял связи между идеями. Пройди 18 залов, реши задачи хранителей и собери печати знаний.</p><div class="actions"><button class="btn primary" data-action="lesson" data-i="${n}">${state.done.length?'Продолжить путь':'Начать путешествие'} →</button><button class="btn" data-action="review">Повторить ошибки${state.weak.length?' · '+state.weak.length:''}</button></div><p class="small muted" style="margin:16px 0 0">Один зал: конспект → 4 задачи → устный ответ.<br>Можно выбрать любую тему. За ошибки нет штрафа.</p></div><div class="hero-art" role="img" aria-label="Каменные арки тихого архива, открытая книга и оливковая ветвь"></div></section>
