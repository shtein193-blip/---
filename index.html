function lesson(i){activeTopic=i;shell('lesson');const t=TOPICS[i];app.innerHTML=`<div class="reading">${back()}<div class="eyebrow">Зал ${i+1} из 18 ${state.done.includes(i)?'· печать получена':''}</div><h1>${t.title}</h1><p class="lead">${t.scene}</p><section class="panel notes"><h2>Суть за минуту</h2>${t.notes.map(p=>`<p>${p}</p>`).join('')}<div class="callout"><b>Зацепка для памяти</b><br>${t.memory}</div></section><div class="actions footactions"><button class="btn primary" data-action="quest" data-i="${i}">К испытаниям · 4 задачи →</button><button class="btn" data-action="oral" data-i="${i}">Рассказать вслух</button></div><p class="small muted" style="margin-top:16px">Прочитай, закрой мысленно конспект и объясни главную идею своими словами. Не нужно заучивать формулировки дословно.</p><details><summary>Полный текст из твоего документа</summary><div class="source">${esc(t.source)}</div></details></div>`;focusPage()}
function mark(q,ok){if(ok){state.weak=state.weak.filter(id=>id!==q.id);if(!state.earned.includes(q.id)){state.earned.push(q.id);state.xp+=10}}else if(!state.weak.includes(q.id))state.weak.push(q.id);save()}
function startQuiz(mode,ids,topic=null){shell('quiz');const queue=shuffle(ids);session={mode,queue,topic,pos:0,initial:queue.length,attempts:[],correctIds:[],answered:false,options:[],retry:0};quiz()}
function quiz(){shell('quiz');if(!session||session.pos>=session.queue.length)return finish();let s=session,q=findQ(s.queue[s.pos]);s.answered=false;s.current=q;s.options=shuffle(q.options.map((text,i)=>({text,ok:i===0})));const names={quest:'Испытание хранителя',review:'Мастерская ошибок',mixed:'Перемешанные знания',exam:'Совет мудрецов'};app.innerHTML=`<div class="reading">${back()}<div class="meta"><span>${names[s.mode]}</span><span>${s.pos<s.initial?`${s.pos+1} / ${s.initial}`:`Повтор ошибки · ${s.pos-s.initial+1}`}</span></div><div class="track" aria-hidden="true" style="margin-bottom:24px"><div class="fill" style="width:${Math.min(s.pos/s.initial*100,100)}%"></div></div><div class="eyebrow">Тема ${q.topic+1} · ${TOPICS[q.topic].title}</div><section class="panel"><h1 class="question" id="question">${esc(q.text)}</h1><div class="options" role="group" aria-labelledby="question">${s.options.map((o,i)=>`<button class="option" data-action="answer" data-i="${i}"><span class="key" aria-hidden="true">${i+1}</span><span>${esc(o.text)}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div></section><p class="small muted" style="margin-top:16px">${s.mode==='exam'?'Без подсказок. Ответ нельзя изменить. Разбор появится после 18-го вопроса.':'Можно отвечать клавишами 1–3. Ошибки не отнимают очки и вернутся в конце раунда.'}</p></div>`;focusPage()}
function answer(i){let s=session;if(!s||s.answered||!s.options[i])return;const q=s.current,o=s.options[i];s.answered=true;s.attempts.push({id:q.id,ok:o.ok,choice:o.text,initial:s.pos<s.initial});if(o.ok&&!s.correctIds.includes(q.id))s.correctIds.push(q.id);if(s.mode!=='exam'){mark(q,o.ok);if(!o.ok)s.queue.push(q.id)}const btns=[...app.querySelectorAll('.option')];btns.forEach((b,k)=>{b.disabled=true;if(s.mode!=='exam'){if(s.options[k].ok)b.classList.add('correct');if(k===i&&!o.ok)b.classList.add('wrong')}else if(k===i)b.setAttribute('aria-pressed','true')});let f=$('#feedback');f.className='feedback'+(s.mode!=='exam'&&!o.ok?' bad':'');f.innerHTML=s.mode==='exam'?`<b>Ответ принят.</b><p>Проверка — в конце аттестации.</p><button class="btn primary" data-action="next">${s.pos+1===s.queue.length?'Получить результат':'Следующий вопрос →'}</button>`:`<b>${o.ok?'✓ Верно. Связь восстановлена.':'↻ Пока нет. Разберёмся.'}</b><p>${esc(q.explain)}${!o.ok?' Задача вернётся в конце раунда.':''}</p><button class="btn primary" data-action="next">${s.pos+1===s.queue.length?'Завершить раунд':'Дальше →'}</button>`;f.querySelector('button').focus({preventScroll:true})}
function finish(){const s=session;if(!s)return home();shell('results');const first=s.attempts.filter(a=>a.initial),hits=first.filter(a=>a.ok).length,errors=first.filter(a=>!a.ok);if(s.mode==='exam'){s.attempts.forEach(a=>mark(findQ(a.id),a.ok));state.best=Math.max(state.best??0,hits);save()}if(s.mode==='quest'&&TOPICS[s.topic].questions.every(q=>s.correctIds.includes(q.id))){if(!state.done.includes(s.topic))state.done.push(s.topic);save()}const exam=s.mode==='exam',title=exam?(hits>=15?'Совет принял твой отчёт.':'Совет нашёл пробелы.'):s.mode==='quest'?'Ещё одна печать Архива.':'Связи восстановлены.';app.innerHTML=`<div class="reading">${back()}<div class="eyebrow">${exam?'Результат аттестации':'Раунд завершён'}</div><h1>${title}</h1><p class="muted">${exam?(hits>=15?'Хороший результат в этом наборе. Теперь проверь развёрнутый ответ вслух: тест не заменяет устную аттестацию.':'Это тренировка, а не провал. Вернись к слабым темам и объясни их своими словами.'):'Все задачи раунда решены верно, включая повторения. Следующий шаг — пересказ без вариантов ответа.'}</p><div class="stats"><div class="stat"><b>${hits}/${s.initial}</b><span>с первой попытки</span></div><div class="stat"><b>${s.attempts.length-s.initial}</b><span>повторных задач</span></div><div class="stat"><b>${exam?state.best+'/18':state.done.length+'/18'}</b><span>${exam?'лучший тест':'печатей собрано'}</span></div></div><div class="actions">${s.mode==='quest'?`<button class="btn primary" data-action="oral" data-i="${s.topic}">Ответить по теме вслух</button><button class="btn" data-action="lesson" data-i="${(s.topic+1)%18}">Следующий зал →</button>`:`<button class="btn primary" data-action="${state.weak.length?'review':'randomOral'}">${state.weak.length?'Повторить ошибки · '+state.weak.length:'Вытянуть устный билет'}</button><button class="btn" data-action="home">На карту</button>`}</div>${errors.length?`<h2 style="margin-top:32px">Что повторить</h2><p class="small muted">${exam?'Здесь ошибки завершённого теста.':'Здесь задачи, в которых ты ошибся с первой попытки. Они уже разобраны, но их полезно повторить позже.'}</p>${errors.map(a=>{const q=findQ(a.id);return `<article class="resultitem"><span class="badge">Тема ${q.topic+1}</span><h3 style="margin-top:12px">${esc(q.text)}</h3><p class="badtext">Твой ответ: ${esc(a.choice)}</p><p class="correcttext"><b>Верно:</b> ${esc(q.options[0])}</p><p class="muted">${esc(q.explain)}</p><button class="btn" data-action="lesson" data-i="${q.topic}">Открыть тему</button></article>`}).join('')}`:'<div class="callout">Ни одной ошибки с первой попытки. Для более сильной проверки попробуй устный ответ без конспекта.</div>'}${exam?`<details><summary>Разбор всех 18 ответов</summary>${first.map(a=>{let q=findQ(a.id);return `<article class="resultitem"><b>${a.ok?'✓':'↻'} ${esc(q.text)}</b><p>Твой ответ: ${esc(a.choice)}</p><p><b>Верно:</b> ${esc(q.options[0])}</p><p class="muted">${esc(q.explain)}</p></article>`}).join('')}</details>`:''}</div>`;focusPage()}
function review(){if(!state.weak.length){shell('review');app.innerHTML=`<div class="reading">${back()}<div class="eyebrow">Мастерская ошибок</div><h1>Сейчас здесь чисто.</h1><p>В списке нет нерешённых ошибок. Это ещё не означает, что все темы освоены: проверь память без подсказок.</p><div class="actions"><button class="btn primary" data-action="mixed">Быстрая тренировка</button><button class="btn" data-action="randomOral">Устный билет</button></div></div>`;focusPage()}else startQuiz('review',[...state.weak])}
function exam(){shell('exam');app.innerHTML=`<div class="reading">${back()}<div class="eyebrow">Финал · совет мудрецов</div><h1>Собери целую картину.</h1><p class="lead">18 вопросов: по одному случайному из каждой темы. Порядок вопросов и вариантов меняется.</p><section class="panel"><h2>Правила совета</h2><ul class="numberlist"><li>Отвечай без конспекта. Ограничения времени нет.</li><li>Выбранный ответ окончательный; пояснения будут в конце.</li><li>Ошибки попадут в мастерскую повторения. Печати залов тест не выдаёт.</li><li>15 из 18 — ориентир этого тренажёра, а не проходной балл твоего преподавателя.</li></ul><p class="small muted">Лучший результат: ${state.best===null?'пока нет':state.best+'/18'}. Банк — 72 задачи; повторный тест может содержать знакомые вопросы.</p><button class="btn primary" data-action="startExam">Начать аттестацию →</button></section></div>`;focusPage()}
function oral(i){activeTopic=i;shell('oral');left=90;const t=TOPICS[i],saved=state.oral[i]||{};app.innerHTML=`<div class="reading">${back()}<div class="eyebrow">Устный билет · тема ${i+1}</div><h1>${t.title}</h1><p>Сначала расскажи без подсказок: <b>определение → основные идеи → пример → вывод.</b> Затем открой план и отметь, что действительно прозвучало.</p><section class="panel"><div class="meta"><span>Необязательный таймер</span><span>Оценка — только твоя</span></div><div class="actions"><output class="timer" id="time" aria-label="Осталось времени">01:30</output><button class="btn primary" data-action="timer" id="timerBtn">Начать 90 секунд</button><button class="btn" data-action="timerReset">Сбросить</button></div><p class="small muted" id="timerMessage" role="status" style="margin-top:16px">Не спеши: после сигнала можно продолжать ответ.</p><label for="oralNotes"><b>Твои опорные слова</b></label><textarea id="oralNotes" placeholder="Попробуй сначала восстановить идеи самостоятельно…">${esc(saved.notes||'')}</textarea><details style="margin-top:16px"><summary>Открыть план самопроверки</summary><div class="checks">${t.oral.map((x,k)=>`<label class="check"><input type="checkbox" data-check="${k}" ${saved.checks?.includes(k)?'checked':''}><span>${x}</span></label>`).join('')}</div><div class="callout"><b>Зацепка</b><br>${t.memory}</div><p id="oralScore" class="small muted"></p></details></section><div class="actions footactions"><button class="btn" data-action="lesson" data-i="${i}">Вернуться к конспекту</button><button class="btn primary" data-action="randomOral">Другой билет →</button></div><p class="small muted" style="margin-top:16px">Квест не слушает микрофон и не оценивает текст автоматически. Галочки — самооценка, они не выдают печать за тему.</p></div>`;oralScore();focusPage()}
function oralScore(){let el=$('#oralScore');if(el)el.textContent=`Пунктов отмечено: ${app.querySelectorAll('[data-check]:checked').length}/4. Если не можешь привести пример, вернись к конспекту.`}
function saveOral(){state.oral[activeTopic]={notes:$('#oralNotes').value,checks:[...app.querySelectorAll('[data-check]:checked')].map(e=>+e.dataset.check)};save();oralScore()}
function timerToggle(){if(timer){clearInterval(timer);timer=null;$('#timerBtn').textContent='Продолжить';return}if(left<=0)left=90;$('#timerBtn').textContent='Пауза';timer=setInterval(()=>{left--;$('#time').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0){clearInterval(timer);timer=null;$('#timerBtn').textContent='Ещё 90 секунд';$('#timerMessage').textContent='90 секунд истекли. Заверши мысль и сверься с планом.'}},1000)}
function library(){shell('library');app.innerHTML=`<div class="reading">${back()}<div class="eyebrow">Карманный справочник</div><h1>Все идеи под рукой.</h1><p class="muted">18 кратких конспектов, планы ответа и полный текст твоего файла. Поиск работает и по содержимому.</p><label for="search">Найти тему, мыслителя или понятие</label><input class="search" id="search" type="search" placeholder="Например: карма, четыре причины, Сократ"><p class="small muted" id="found" role="status">Найдено тем: 18</p><div class="library">${TOPICS.map((t,i)=>`<details data-topic="${i}"><summary>${String(i+1).padStart(2,'0')} · ${t.title}</summary><div class="notes">${t.notes.map(p=>`<p>${p}</p>`).join('')}<div class="callout">${t.memory}</div><h3>План устного ответа</h3><ol class="numberlist">${t.oral.map(x=>`<li>${x}</li>`).join('')}</ol><div class="actions"><button class="btn" data-action="lesson" data-i="${i}">В этот зал</button><button class="btn" data-action="oral" data-i="${i}">Ответить вслух</button></div><details><summary>Полный текст документа</summary><div class="source">${esc(t.source)}</div></details></div></details>`).join('')}</div></div>`;focusPage()}
function help(){shell('help');app.innerHTML=`<div class="reading">${back()}<div class="eyebrow">Путеводитель</div><h1>Не зубри. Восстанавливай связи.</h1><section class="panel"><h2>Как проходить</h2><ol class="numberlist"><li><b>Выбери зал.</b> Прочитай короткий конспект и объясни себе одну главную мысль.</li><li><b>Реши четыре задачи.</b> Варианты перемешиваются. Ошибочная задача возвращается в конце, пока ты не ответишь верно.</li><li><b>Получи печать.</b> Она означает, что ты решил все четыре задачи темы, в том числе после подсказок. Это не гарантия знания на экзамене.</li><li><b>Проговори билет.</b> Без конспекта, затем сверяйся с планом. Таймер необязателен.</li><li><b>Проверь перенос.</b> На следующий день снова реши вопросы и объясни идеи на своих примерах.</li></ol><h2>Если времени мало</h2><p>Сначала пройди «Быструю тренировку», затем открой слабые темы. Особенно полезно различать пары: ценность / убеждение, материализм / идеализм, Конфуций / Лао-цзы, Гераклит / Парменид, Платон / Аристотель, стоики / эпикурейцы.</p><h2>Что измеряет прогресс</h2><p>10 очков выдаются за первый верный ответ на уникальную задачу: максимум 720. Печати даёт прохождение залов. Список ошибок хранит вопросы, последний ответ на которые был неверным; верный ответ убирает вопрос из списка.</p><p>Результат «с первой попытки» честно отделяет первые ответы от исправлений. В финальном тесте 18 вопросов, ориентир 15/18 условный.</p><h2>Материал и ограничения</h2><p>За основу взят твой файл «ФИЛОСОФИЯ 18 ВОПРОСОВ.docx»: 8 вводных вопросов и 10 историко-философских тем. Нумерация приведена к сквозной 1–18; краткие формулировки и задания составлены для тренировки.</p><p>Уточнено: философские традиции не ограничены Грецией; у-вэй не значит безделье; ортодоксальность в Индии определяется признанием Вед. Полный текст исходника доступен в каждой теме; исправлены явные повреждения символов. Для аттестации учитывай требования преподавателя.</p><h2>Сохранение и запуск</h2><p>Это один HTML-файл без внешних библиотек и сетевых запросов. Для надёжной работы скачай его и открой в обычном браузере. Встроенный просмотрщик может ограничивать скрипты или сохранение. Прогресс привязан к браузеру и этому файлу; приватный режим, очистка данных или перенос файла могут его сбросить.</p><p>На телефоне открывай файл через браузер, а не предпросмотр файлового менеджера. Интернет и регистрация не нужны.</p><button class="btn danger" data-action="reset">Сбросить весь прогресс</button></section></div>`;focusPage()}
app.addEventListener('input',e=>{if(e.target.id==='search'){const term=e.target.value.trim().toLocaleLowerCase('ru');let count=0;app.querySelectorAll('[data-topic]').forEach(el=>{let t=TOPICS[+el.dataset.topic],show=[t.title,...t.notes,t.memory,...t.oral,t.source].join(' ').toLocaleLowerCase('ru').includes(term);el.hidden=!show;if(show)count++});$('#found').textContent=count?`Найдено тем: ${count}`:'Ничего не найдено. Попробуй другое понятие.'}if(e.target.id==='oralNotes')saveOral()});
app.addEventListener('change',e=>{if(e.target.matches('[data-check]'))saveOral()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,i=Number(b.dataset.i);if(['home','library','exam','help','lesson','oral','randomOral','mixed','review'].includes(a)&&route==='quiz'&&session&&session.pos<session.queue.length){if(!confirm(session.mode==='exam'?'Прервать аттестацию? Незавершённый тест и его ответы не сохранятся.':'Выйти из раунда? Завершённые ответы сохранены, но текущий раунд придётся начать заново.'))return}
if(a==='home')home();else if(a==='lesson')lesson(i);else if(a==='quest')startQuiz('quest',TOPICS[i].questions.map(q=>q.id),i);else if(a==='answer')answer(i);else if(a==='next'){if(session?.answered){session.pos++;quiz()}}else if(a==='review')review();else if(a==='mixed')startQuiz('mixed',shuffle(ALL).slice(0,12).map(q=>q.id));else if(a==='exam')exam();else if(a==='startExam')startQuiz('exam',TOPICS.map(t=>shuffle(t.questions)[0].id));else if(a==='oral')oral(i);else if(a==='randomOral'){let j=Math.floor(Math.random()*18);if(route==='oral'&&j===activeTopic)j=(j+1)%18;oral(j)}else if(a==='library')library();else if(a==='help')help();else if(a==='timer')timerToggle();else if(a==='timerReset'){clearInterval(timer);timer=null;left=90;$('#time').textContent='01:30';$('#timerBtn').textContent='Начать 90 секунд';$('#timerMessage').textContent='Не спеши: после сигнала можно продолжать ответ.'}else if(a==='reset')$('#resetDialog').showModal();else if(a==='cancelReset')$('#resetDialog').close();else if(a==='confirmReset'){state=fresh();save();$('#resetDialog').close();home()}});
document.addEventListener('keydown',e=>{if(route==='quiz'&&session&&!session.answered&&!/INPUT|TEXTAREA/.test(e.target.tagName)&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&['1','2','3'].includes(e.key)){e.preventDefault();answer(Number(e.key)-1)}});
home();
</script></body></html>
